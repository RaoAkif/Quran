<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#6e1322"/>
      <stop offset="50%" stop-color="#540b16"/>
      <stop offset="100%" stop-color="#38060e"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="35%" stop-color="#dfb76c"/>
      <stop offset="70%" stop-color="#c5983e"/>
      <stop offset="100%" stop-color="#f5e0a0"/>
    </linearGradient>
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Ornate Calligraphy: القرآن -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)" text-anchor="middle">
    <!-- Inner subtle decorative border -->
    <rect x="28" y="28" width="456" height="456" rx="87" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.25"/>
    
    <!-- Arabic Calligraphy "القرآن" -->
    <text x="256" y="325" font-family="'Amiri', 'Noto Naskh Arabic', 'Scheherazade New', 'Jameel Noori Nastaleeq', 'Traditional Arabic', serif" font-size="205" font-weight="bold" letter-spacing="2">القرآن</text>
  </g>
</svg>
